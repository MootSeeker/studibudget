name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'vault/**'
      - 'docs/**'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'vault/**'
      - 'docs/**'
      - 'CLAUDE.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: read

# PR-Läufe brechen ältere Läufe desselben PRs ab; auf main läuft jeder Commit zu Ende.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  statisch:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck

  unit:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_SUITE: unit
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Tests mit Abdeckung; Untergrenzen pro Bereich stehen in scripts/coverage-areas.json
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bericht-unit
          path: reports
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}

  # Findet Zeitfehler, die nur auf langsamen Rechnern auftreten (Datenbank künstlich verlangsamt).
  langsam:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_SUITE: langsam
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:slow
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bericht-langsam
          path: reports
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}

  # Zugriffsregeln, Konto und Sync gegen ein lokales Supabase (Docker)
  datenbank:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_SUITE: datenbank
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase
      - run: npm run test:db
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bericht-datenbank
          path: reports
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}

  # Ganze App im echten Browser gegen ein lokales Supabase (Docker), je Browser ein Lauf
  e2e:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Mit Zwischenspeicher lädt der Befehl keinen Browser mehr herunter, installiert aber weiter die Systempakete.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Ein Wackler (erst beim zweiten Versuch grün) gilt als Fehler.
      - run: npx playwright test --project=${{ matrix.browser }} --fail-on-flaky-tests
      # Nur Chromium: Referenzbilder gibt es nur dafür (e2e/visuell.spec.ts überspringt andere Browser).
      # Ein Bildunterschied heisst meist: Die Oberfläche hat sich gewollt geändert und die Referenzbilder müssen neu entstehen.
      - name: Hinweis zu den Referenzbildern
        if: ${{ failure() && matrix.browser == 'chromium' }}
        run: |
          if find test-results -name '*-diff.png' | grep -q .; then
            {
              echo '### Referenzbilder erneuern?'
              echo
              echo 'Der Vergleich mit den Referenzbildern ist fehlgeschlagen (Unterschiede im Artefakt `bericht-e2e-chromium`).'
              echo 'Wenn sich die Oberfläche gewollt geändert hat:'
              echo
              echo '1. Unter Actions den Workflow **Referenzbilder** auf diesem Branch starten.'
              echo '2. Lokal `npm run referenzbilder` ausführen (übernimmt das Ergebnis nach `e2e/referenz/`).'
              echo '3. Bilder im Diff ansehen, committen und pushen.'
              echo
              echo 'Details: `docs/testing.md`, Abschnitt «Referenzbilder erneuern».'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Referenzbilder::Bildvergleich fehlgeschlagen. Workflow «Referenzbilder» starten, dann npm run referenzbilder (siehe Zusammenfassung)."
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bericht-e2e-${{ matrix.browser }}
          path: |
            reports/e2e-${{ matrix.browser }}
            test-results
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}

  build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npm run check:build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Fasst alle Berichte als Zusammenfassung auf der Actions-Seite zusammen.
  bericht:
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs: [unit, langsam, datenbank]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bericht-*
          path: reports
          merge-multiple: true
      - run: node scripts/test-summary.mjs

  # Ein einziger Status für alle Pflichtjobs (später für den Branch-Schutz). Neue Pflichtjobs hier in `needs` eintragen;
  # src/test/ci.test.ts prüft das. Grün nur, wenn jeder Pflichtjob grün ist (nicht rot, abgebrochen oder übersprungen).
  ci-gesamt:
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [statisch, unit, langsam, datenbank, e2e, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ERGEBNISSE: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "Ergebnisse: $ERGEBNISSE"
          for r in $ERGEBNISSE; do
            if [ "$r" != "success" ]; then
              echo "::error::Ein Pflichtjob ist nicht grün (Ergebnis: $r; möglich sind failure, cancelled, skipped)."
              exit 1
            fi
          done

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [ci-gesamt]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

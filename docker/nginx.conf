# Die App liegt unter /studibudget/ (base in vite.config.ts). Unbekannte Pfade fallen auf index.html zurück.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = / {
        return 302 /studibudget/;
    }

    location /studibudget/ {
        try_files $uri $uri/ /studibudget/index.html;
    }

    # Service Worker und Startseite nie aus einem alten Zwischenspeicher, sonst kommen Updates nicht an.
    location ~ ^/studibudget/(sw\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
